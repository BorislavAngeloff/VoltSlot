<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Грешка')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container col-md-6 mt-5">
    <div class="card border-danger shadow-sm p-4 text-center">
        <h3 class="text-danger mb-3" th:text="${errorTitle ?: 'Грешка при заявката'}">Грешка</h3>
        <p class="lead" th:text="${errorMessage ?: 'Невалидна операция или липсващ ресурс.'}"></p>
        <div class="mt-3">
            <a href="/" class="btn btn-dark">Към началната страница</a>
        </div>
    </div>
</div>
</body>
</html>
