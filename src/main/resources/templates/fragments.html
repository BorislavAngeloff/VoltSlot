<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">VoltSlot EV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="/">⚡ VoltSlot EV</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Начало</a>
            <a class="nav-link" href="/rules">Правила и Неустойки</a>
            <th:block th:if="${session.user_id == null}">
                <a class="nav-link" href="/login">Вход</a>
                <a class="nav-link" href="/register">Регистрация</a>
            </th:block>
            <th:block th:if="${session.user_id != null}">
                <a class="nav-link" href="/sessions">Резервации и ANPR</a>
                <a class="nav-link" href="/stations">Зарядни станции</a>
                <a class="nav-link text-warning" href="/logout" th:text="'Изход (' + ${session.username} + ')'">Изход</a>
            </th:block>
        </div>
    </div>
</nav>
</body>
</html>
