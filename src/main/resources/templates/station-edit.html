<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Редактиране на станция')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container col-md-5">
    <h3>Редактиране на станция</h3>
    <form th:action="@{/stations/edit/{id}(id=${stationId})}" th:object="${stationDto}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Име</label>
            <input type="text" th:field="*{name}" class="form-control">
            <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
        </div>
        <div class="mb-3">
            <label class="form-label">Локация</label>
            <input type="text" th:field="*{location}" class="form-control">
            <small class="text-danger" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></small>
        </div>
        <div class="mb-3">
            <label class="form-label">Тип</label>
            <select th:field="*{chargerType}" class="form-select">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Цена EUR/kWh</label>
            <input type="number" step="0.01" th:field="*{pricePerKwh}" class="form-control">
            <small class="text-danger" th:if="${#fields.hasErrors('pricePerKwh')}" th:errors="*{pricePerKwh}"></small>
        </div>
        <button type="submit" class="btn btn-warning w-100">Запази промените</button>
    </form>
</div>
</body>
</html>
